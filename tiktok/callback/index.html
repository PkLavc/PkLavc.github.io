<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>TikTok Authorization | PkLavc</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0b0d;color:#f5f5f5;font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(92vw,620px);padding:32px;border:1px solid #2b2b31;border-radius:18px;background:#121217}
    h1{margin:0 0 10px;font-size:28px}
    p{margin:0;color:#b9b9c2}
    .ok{color:#8fe3aa}.error{color:#ff8d8d}
    a{display:inline-block;margin-top:24px;color:#fff}
  </style>
</head>
<body>
  <main>
    <h1 id="title">TikTok authorization</h1>
    <p id="message">Checking the authorization response…</p>
    <a href="/tiktok/" id="retry" hidden>Try again</a>
  </main>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const code = params.get("code");
      const state = params.get("state");
      const error = params.get("error");
      const errorDescription = params.get("error_description");
      const expectedState = sessionStorage.getItem("tiktok_oauth_state");
      const title = document.getElementById("title");
      const message = document.getElementById("message");
      const retry = document.getElementById("retry");

      const fail = (text) => {
        title.textContent = "Authorization failed";
        title.className = "error";
        message.textContent = text;
        retry.hidden = false;
      };

      if (error) {
        fail(errorDescription || error);
        return;
      }

      if (!code) {
        fail("TikTok did not return an authorization code.");
        return;
      }

      if (!expectedState || !state || state !== expectedState) {
        fail("The authorization state could not be verified. Start the connection again.");
        return;
      }

      sessionStorage.removeItem("tiktok_oauth_state");
      sessionStorage.setItem("tiktok_authorization_code", code);
      sessionStorage.setItem("tiktok_granted_scopes", params.get("scopes") || "");

      title.textContent = "TikTok authorized";
      title.className = "ok";
      message.textContent = "Authorization was received successfully. The secure server-side token exchange is the next step.";
      history.replaceState({}, document.title, location.pathname);
    })();
  </script>
</body>
</html>
