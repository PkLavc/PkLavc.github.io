name: Publish PkLavc news to Telegram channels

on:
  schedule:
    # Follow each hourly primary/recovery article-generation window with time for Pages sync.
    - cron: "9,39 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Check bot, preview, send a test message, or publish new articles"
        required: true
        type: choice
        default: check
        options: [check, preview, test, publish]
      category:
        description: "Telegram channel(s) for this manual action"
        required: true
        type: choice
        default: all
        options: [all, games, tech]
  push:
    branches: [main]
    paths:
      - ".github/workflows/telegram-publish.yml"

permissions:
  contents: read

concurrency:
  group: pklavc-telegram-news-channels
  cancel-in-progress: false

jobs:
  syndicate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out private original blog and persistent Telegram state
        uses: actions/checkout@v4
        with:
          repository: PkLavc/blog
          ref: main
          path: private-blog
          token: ${{ secrets.PRIVATE_BLOG_REPO_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install free thumbnail dependency
        run: python -m pip install --disable-pip-version-check "Pillow>=10,<13"

      - name: Run Telegram publisher offline tests
        working-directory: private-blog
        run: python -m unittest scripts.social_video.test_telegram_publisher -v

      - name: Preview candidate Tech and Games articles (no posts)
        working-directory: private-blog
        run: python -m scripts.social_video.telegram_publisher --root . --mode preview --category all

      - name: Verify or publish via official Telegram Bot API
        working-directory: private-blog
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_TECH: ${{ vars.TELEGRAM_CHAT_TECH }}
          TELEGRAM_CHAT_GAMES: ${{ vars.TELEGRAM_CHAT_GAMES }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_CATEGORY: ${{ inputs.category }}
        run: |
          mode="${REQUESTED_MODE:-publish}"
          category="${REQUESTED_CATEGORY:-all}"
          if [[ -z "$TELEGRAM_BOT_TOKEN" || ( -z "$TELEGRAM_CHAT_TECH" && -z "$TELEGRAM_CHAT_GAMES" ) ]]; then
            if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "push" ]]; then
              echo "::notice::Telegram is not configured yet. Add TELEGRAM_BOT_TOKEN secret and Telegram channel variables in this public repository."
              exit 0
            fi
            echo "::error::TELEGRAM_BOT_TOKEN and at least one TELEGRAM_CHAT_* are required."
            exit 1
          fi
          python -m scripts.social_video.telegram_publisher --root . --mode "$mode" --category "$category"
