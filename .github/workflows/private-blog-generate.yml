name: Generate private blog on public runner

on:
  schedule:
    - cron: "17 * * * *" # Primary hourly slot; one in five UTC hour slots is Tech
    - cron: "47 * * * *" # Recovery slot if the primary was missed or failed
    - cron: "43 15 * * 3" # Weekly Microsoft-only Tech spotlight, 15:43 UTC on Wednesday
  workflow_dispatch:
    inputs:
      category:
        description: "Editorial category for manual generation"
        required: true
        type: choice
        default: tech
        options:
          - tech
          - games
      mode:
        description: "Generate an article, translate pending content, or run a smoke test"
        required: true
        type: choice
        default: smoke
        options:
          - smoke
          - generate
          - translate
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-blog-generate.yml"

permissions:
  contents: read

concurrency:
  group: private-blog-public-runner-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  schedule-recovery-gate:
    name: Skip redundant hourly recovery
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      should_generate: ${{ steps.check.outputs.should_generate }}
    steps:
      - name: Determine whether backup should generate
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import datetime
          import json
          import os
          import urllib.request

          should_generate = True
          if os.getenv("EVENT_SCHEDULE") == "47 * * * *":
              now = datetime.datetime.now(datetime.timezone.utc)
              window_start = now.replace(minute=17, second=0, microsecond=0)
              if now < window_start:
                  window_start -= datetime.timedelta(hours=1)
              url = (
                  f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}"
                  "/actions/runs?event=schedule&per_page=100"
              )
              try:
                  request = urllib.request.Request(
                      url,
                      headers={
                          "Accept": "application/vnd.github+json",
                          "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                          "X-GitHub-Api-Version": "2022-11-28",
                      },
                  )
                  with urllib.request.urlopen(request, timeout=20) as response:
                      runs = json.load(response).get("workflow_runs", [])
                  prior = [
                      run for run in runs
                      if str(run["id"]) != os.environ["GH_RUN_ID"]
                      and run.get("path", "").endswith("/private-blog-generate.yml")
                      and datetime.datetime.fromisoformat(
                          run["created_at"].replace("Z", "+00:00")
                      ) >= window_start
                  ]
                  # A successful, running, or queued primary already owns this slot.
                  # On failure, the :47 attempt retries with the latest private code.
                  should_generate = not any(
                      run.get("status") != "completed"
                      or run.get("conclusion") == "success"
                      for run in prior
                  )
                  print(f"Hourly recovery: {len(prior)} previous runs; "
                        f"retry needed: {should_generate}")
              except (OSError, ValueError, KeyError, json.JSONDecodeError) as exc:
                  # Fail open: don't silently lose a slot because GitHub API is down.
                  print(f"::warning::Could not inspect primary run; "
                        f"attempting recovery: {type(exc).__name__}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"should_generate={str(should_generate).lower()}\n")
          PY

  smoke:
    if: github.event_name == 'push' || inputs.mode == 'smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRIVATE_BLOG_REPO_TOKEN: ${{ secrets.PRIVATE_BLOG_REPO_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Verify required generation secrets are configured
        shell: bash
        run: |
          missing=0
          for name in PRIVATE_BLOG_REPO_TOKEN GEMINI_API_KEY OPENROUTER_API_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Checkout private blog repository
        uses: actions/checkout@v4
        with:
          repository: PkLavc/blog
          ref: main
          token: ${{ secrets.PRIVATE_BLOG_REPO_TOKEN }}
          path: private-blog
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install article dependencies
        working-directory: private-blog
        run: python -m pip install -r scripts/blog_automation/requirements.txt 'requests>=2.32,<3'

      - name: Verify private repository token can push
        working-directory: private-blog
        run: git push --dry-run origin HEAD:main

      - name: Validate private generation pipeline without API calls or publishing
        working-directory: private-blog
        run: bash scripts/private_runner/runner.sh smoke-generation
  offline-translation-integration:
    if: (github.event_name == 'push' && contains(github.event.head_commit.message, '[offline-translation-test]')) || (github.event_name == 'workflow_dispatch' && inputs.mode == 'smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout private blog source
        uses: actions/checkout@v4
        with:
          repository: PkLavc/blog
          ref: main
          token: ${{ secrets.PRIVATE_BLOG_REPO_TOKEN }}
          path: private-blog
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify English to Brazilian Portuguese and Spanish without LLM keys
        working-directory: private-blog
        env:
          ARGOS_DEVICE_TYPE: cpu
        run: |
          python -m pip install 'argostranslate>=1.10,<2'
          python -m scripts.blog_automation.install_offline_translations
          python -m unittest scripts.blog_automation.test_offline_translation_integration
          python -m scripts.private_runner.tasks translation_check
  generate:
    needs: schedule-recovery-gate
    if: needs.schedule-recovery-gate.outputs.should_generate == 'true' && (github.event_name == 'schedule' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[blog-translate-backfill]') || contains(github.event.head_commit.message, '[blog-generate-now]'))) || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'generate' || inputs.mode == 'translate')))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      translated: ${{ steps.blog_translation.outputs.changed }}
    steps:
      - name: Checkout private blog repository
        uses: actions/checkout@v4
        with:
          repository: PkLavc/blog
          ref: main
          token: ${{ secrets.PRIVATE_BLOG_REPO_TOKEN }}
          path: private-blog
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install article image dependency
        working-directory: private-blog
        run: python -m pip install -r scripts/blog_automation/requirements.txt 'requests>=2.32,<3'

      - name: Test generated article source and public paths
        working-directory: private-blog
        run: bash scripts/private_runner/runner.sh validate-generation
      - name: Choose hourly editorial lane
        id: lane
        if: github.event_name == 'schedule' || inputs.mode == 'generate' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[blog-generate-now]'))
        working-directory: private-blog
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_TRIGGER: ${{ github.event.schedule }}
          REQUESTED_CATEGORY: ${{ inputs.category }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: python -m scripts.private_runner.tasks choose_lane
      - name: Collect, select, generate and validate
        if: github.event_name == 'schedule' || inputs.mode == 'generate' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[blog-generate-now]'))
        working-directory: private-blog
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          MAX_GEMINI_HTTP_REQUESTS_PER_RUN: ${{ vars.MAX_GEMINI_HTTP_REQUESTS_PER_RUN || '6' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openrouter/free' }}
          MAX_OPENROUTER_HTTP_REQUESTS_PER_RUN: ${{ vars.MAX_OPENROUTER_HTTP_REQUESTS_PER_RUN || '3' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_MODEL: ${{ vars.CLOUDFLARE_AI_MODEL || '@cf/openai/gpt-oss-120b' }}
          CLOUDFLARE_TRANSLATION_MODEL: ${{ vars.CLOUDFLARE_TRANSLATION_MODEL || '@cf/meta/llama-3.1-8b-instruct-fp8' }}
          MAX_CLOUDFLARE_AI_HTTP_REQUESTS_PER_RUN: ${{ vars.MAX_CLOUDFLARE_AI_HTTP_REQUESTS_PER_RUN || '3' }}
          DRY_RUN: "false"
          BLOG_CATEGORY: ${{ steps.lane.outputs.category }}
          TECH_FOCUS: ${{ steps.lane.outputs.focus }}
        run: python -m scripts.blog_automation.run --root .

      - name: Cache free offline translation models
        if: github.event_name == 'schedule' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[blog-translate-backfill]') || contains(github.event.head_commit.message, '[blog-generate-now]'))) || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'generate' || inputs.mode == 'translate'))
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/argos-translate
            ~/.cache/argos-translate
          key: ${{ runner.os }}-argos-en-pt-es-v1

      - name: Translate new English articles immediately with free offline models
        if: github.event_name == 'schedule' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[blog-translate-backfill]') || contains(github.event.head_commit.message, '[blog-generate-now]'))) || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'generate' || inputs.mode == 'translate'))
        working-directory: private-blog
        id: blog_translation
        env:
          TRANSLATE_BACKFILL: ${{ contains(github.event.head_commit.message, '[blog-translate-backfill]') }}
          ARGOS_DEVICE_TYPE: cpu
        run: bash scripts/private_runner/runner.sh translate
      - name: Refresh AI discovery directory
        working-directory: private-blog
        run: node scripts/generate-blog-discovery.mjs

      - name: Validate newsletter and assembled publication before commit
        working-directory: private-blog
        run: bash scripts/private_runner/runner.sh validate-publication
      - name: Detect publication changes
        id: changes
        working-directory: private-blog
        shell: bash
        run: python -m scripts.private_runner.tasks detect_changes
      - name: Commit validated article and indexes to private repository
        if: steps.changes.outputs.changed == 'true'
        working-directory: private-blog
        run: python -m scripts.private_runner.tasks commit_publication
      - name: Report publication result
        run: |
          echo "Private blog changed: ${{ steps.changes.outputs.changed }}"
          echo "The private repository push triggers the static blog sync to GitHub Pages."

  sync-private-blog:
    needs: generate
    if: needs.generate.result == 'success' && needs.generate.outputs.translated == 'true' && needs.generate.outputs.changed == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public website
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PRIVATE_BLOG_REPO_TOKEN }}
          fetch-depth: 0

      - name: Checkout updated private blog source
        uses: actions/checkout@v4
        with:
          repository: PkLavc/blog
          ref: main
          path: private-blog
          fetch-depth: 1

      - name: Build public blog routes
        run: python3 private-blog/scripts/assemble_pages.py --root private-blog --output private-blog/_site

      - name: Sync generated pages
        shell: bash
        run: bash private-blog/scripts/private_runner/sync.sh