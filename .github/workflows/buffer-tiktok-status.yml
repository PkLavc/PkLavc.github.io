name: Check Buffer TikTok delivery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/buffer-tiktok-status.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out private PkLavc publishing state
        uses: actions/checkout@v4
        with:
          repository: PkLavc/blog
          ref: main
          token: ${{ secrets.PRIVATE_BLOG_REPO_TOKEN }}
          path: private-blog
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check delivery and remove media only when sent
        working-directory: private-blog
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install -q 'requests>=2.32,<3'
          python -m scripts.social_video.buffer_tiktok --reconcile

      - name: Save updated TikTok publication statuses
        working-directory: private-blog
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add social-state/tiktok-published.json
          if git diff --cached --quiet; then
            echo "Buffer delivery state unchanged."
            exit 0
          fi
          git commit -m "Record Buffer TikTok delivery confirmation"
          git pull --rebase origin main
          git push origin HEAD:main
