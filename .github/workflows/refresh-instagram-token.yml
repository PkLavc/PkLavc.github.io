name: Renew Instagram token automatically

on:
  schedule:
    # Instagram Login long-lived tokens last ~60 days. Rotate twice monthly (UTC) for extra failure margin.
    - cron: "23 6 1,15 * *"
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: "Preflight permissions without refreshing or renew live token"
        required: true
        default: preflight
        options:
          - preflight
          - renew
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-instagram-token.yml"
      - ".github/scripts/refresh_instagram_token.py"

permissions:
  contents: read

concurrency:
  group: instagram-token-rotation
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out rotation script
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate GitHub/Instagram access or refresh tokens in both repositories
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ROTATION_GITHUB_TOKEN: ${{ secrets.INSTAGRAM_TOKEN_ROTACION }}
          INSTAGRAM_AUDIO_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_AUDIO_ACCESS_TOKEN }}
          INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          INSTAGRAM_AUDIO_APP_ID: ${{ vars.INSTAGRAM_AUDIO_APP_ID }}
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" || "${{ inputs.mode }}" == "preflight" ]]; then
            python .github/scripts/refresh_instagram_token.py --preflight
          else
            python .github/scripts/refresh_instagram_token.py
          fi
          python -m unittest discover -s .github/scripts -p 'test_refresh_instagram_audio_token.py' -v
          python .github/scripts/refresh_instagram_audio_token.py
