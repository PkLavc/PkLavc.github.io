name: TikTok Sandbox Content Posting Test

on:
  schedule:
    - cron: "20 13 * * *" # Tech after morning blog generation (UTC)
    - cron: "20 22 * * *" # GTA/Rockstar after evening blog generation (UTC)
  workflow_dispatch:
    inputs:
      category:
        description: "Use a PkLavc article from this category"
        required: true
        type: choice
        default: any
        options:
          - any
          - tech
          - games
      mode:
        description: "Sandbox Content Posting API test"
        required: true
        type: choice
        default: direct
        options:
          - direct
          - draft
  push:
    branches: [main]
    paths:
      - ".github/workflows/tiktok-sandbox-test.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: tiktok-sandbox-test
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'push' # Never publish during code checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout private blog repository
        uses: actions/checkout@v4
        with:
          repository: PkLavc/blog
          ref: main
          token: ${{ secrets.PRIVATE_BLOG_REPO_TOKEN }}
          path: private-blog
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight renderer dependencies
        working-directory: private-blog
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install pillow requests

      - name: Mint GitHub OIDC token for TikTok publisher
        id: oidc
        shell: bash
        run: |
          response="$(curl -fsSL \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fapi.pklavc.com%2Ftiktok%2Fpublish")"
          token="$(printf '%s' "$response" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Run TikTok Sandbox Content Posting test
        working-directory: private-blog
        env:
          TIKTOK_PUBLISH_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          SOCIAL_MAX_VIDEO_MB: ${{ vars.SOCIAL_MAX_VIDEO_MB || '25' }}
          SOCIAL_ALLOW_ESPEAK_FALLBACK: "true"
          EVENT_NAME: ${{ github.event_name }}
          TEST_MODE: ${{ inputs.mode }}
          TIKTOK_SOURCE_CATEGORY: ${{ github.event_name == 'schedule' && (github.event.schedule == '20 22 * * *' && 'games' || 'tech') || inputs.category || 'any' }}
        run: |
          if [ "$TEST_MODE" = "draft" ]; then
            python -m scripts.social_video.tiktok_draft_test
          else
            python -m scripts.social_video.tiktok_test
          fi
      - name: Save successful sandbox TikTok history
        if: success()
        working-directory: private-blog
        shell: bash
        run: |
          if [ ! -f social-state/tiktok-test-published.json ]; then
            echo "No completed TikTok posts to save."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add social-state/tiktok-test-published.json
          if git diff --cached --quiet; then
            echo "TikTok history unchanged."
            exit 0
          fi
          git commit -m "Record PKLavc TikTok sandbox publication"
          git pull --rebase origin main
          git push origin HEAD:main

