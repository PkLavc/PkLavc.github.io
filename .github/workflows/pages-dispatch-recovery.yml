name: Recover GitHub Pages deployment
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages-dispatch-recovery.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  request-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch latest main branch to Pages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --repo "$GH_REPO" --ref main
