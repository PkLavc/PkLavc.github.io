name: Verify Instagram Insights permission
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-instagram-insights.yml
  # workflow_dispatch:
  schedule:
    - cron: '13 11 * * *'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out private PkLavc blog
        uses: actions/checkout@v4
        with:
          repository: PkLavc/blog
          ref: main
          token: ${{ secrets.PRIVATE_BLOG_REPO_TOKEN }}
          path: private-blog
          fetch-depth: 0
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnose basic Reel views permission without publishing
        working-directory: private-blog
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ANALYTICS_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ANALYTICS_ACCESS_TOKEN }}
          INSTAGRAM_AUDIO_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_AUDIO_ACCESS_TOKEN }}
          INSTAGRAM_INSIGHTS_FORCE_CHECK: "true"
          INSTAGRAM_GRAPH_VERSION: ${{ vars.INSTAGRAM_GRAPH_VERSION || 'v26.0' }}
        run: python -m scripts.private_runner.tasks insights_probe
      - name: Test Instagram Insights and store snapshots without publishing
        working-directory: private-blog
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ANALYTICS_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ANALYTICS_ACCESS_TOKEN }}
          INSTAGRAM_AUDIO_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_AUDIO_ACCESS_TOKEN }}
          INSTAGRAM_INSIGHTS_FORCE_CHECK: "true"
          INSTAGRAM_GRAPH_VERSION: ${{ vars.INSTAGRAM_GRAPH_VERSION || 'v26.0' }}
        run: python -m scripts.social_video.instagram_analytics
      - name: Save insights authorization result and any statistics
        working-directory: private-blog
        run: python -m scripts.private_runner.tasks persist_insights