name: Deploy private blog newsletter Worker

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-private-blog-newsletter.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-blog-newsletter-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout private blog repository
        uses: actions/checkout@v4
        with:
          repository: PkLavc/blog
          ref: main
          token: ${{ secrets.PRIVATE_BLOG_REPO_TOKEN }}
          path: private-blog

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install newsletter Worker dependencies
        working-directory: private-blog/newsletter-worker
        run: npm install

      - name: Validate newsletter Worker
        working-directory: private-blog/newsletter-worker
        run: npm test

      - name: Apply newsletter D1 migrations
        working-directory: private-blog/newsletter-worker
        run: npx wrangler d1 migrations apply pklavc-newsletter --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy newsletter Worker
        working-directory: private-blog/newsletter-worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify newsletter health endpoint
        run: |
          python - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen("https://newsletter-api.pklavc.com/health", timeout=20) as response:
              payload = json.load(response)
          assert payload == {"status": "ok", "service": "pklavc-newsletter"}, payload
          print("newsletter health OK")
          PY
