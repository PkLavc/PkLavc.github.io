name: Process private blog social on public runner
# Social backlog retry marker: legacy artwork fallback enabled
# Smoke tests include separated blog-vs-video image-policy checks.
# Direct-upload launch marker (2026-10-13): test queue loaded.
# Run Instagram/YouTube publication smoke checks after token rotation permissions test.
# Facebook Login audio token extended and validated on 2026-10-14; live queue retry requested.

on:
  schedule:
    # Every hour at :47, about 30 minutes after hourly article generation at :17.
    - cron: "47 * * * *"
    # Store twice weekly to prioritize GTA Shorts.
    - cron: "0 12 * * 2,5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Publish queued items, run checks, or preview/publish Store products"
        required: true
        type: choice
        default: smoke
        options:
          - smoke
          - publish
          - store-products-preview
          - store-products-publish
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-blog-social.yml"

permissions:
  contents: read

concurrency:
  group: private-blog-public-runner
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event_name == 'push' || inputs.mode == 'smoke'
    permissions:
      contents: write  # Only to create and delete the transient test release.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRIVATE_BLOG_REPO_TOKEN: ${{ secrets.PRIVATE_BLOG_REPO_TOKEN }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_AUDIO_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_AUDIO_ACCESS_TOKEN }}
      INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_ANALYTICS_REFRESH_TOKEN: ${{ secrets.YOUTUBE_ANALYTICS_REFRESH_TOKEN }}
    steps:
      - name: Verify required social secrets are configured
        shell: bash
        run: |
          missing=0
          for name in PRIVATE_BLOG_REPO_TOKEN INSTAGRAM_ACCESS_TOKEN INSTAGRAM_BUSINESS_ACCOUNT_ID YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN YOUTUBE_ANALYTICS_REFRESH_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Checkout private blog repository
        uses: actions/checkout@v4
        with:
          repository: PkLavc/blog
          ref: main
          token: ${{ secrets.PRIVATE_BLOG_REPO_TOKEN }}
          path: private-blog
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify private repository token can push
        working-directory: private-blog
        run: git push --dry-run origin HEAD:main

      - name: Install smoke-test dependencies
        working-directory: private-blog
        run: |
          python -m pip install -r scripts/blog_automation/requirements.txt
          python -m pip install 'requests>=2.32,<3'

      # Includes GitHub Release upload/cleanup and Meta audio-pagination tests.
      - name: Validate private social code without publishing
        working-directory: private-blog
        run: |
          python -m compileall -q scripts/social_video
          python -m unittest scripts.social_video.test_motion scripts.social_video.test_direct_upload scripts.social_video.test_render scripts.social_video.test_products scripts.social_video.test_limits scripts.social_video.test_analytics scripts.social_video.test_instagram_analytics scripts.blog_automation.test_game_lane scripts.blog_automation.test_json_safe

      - name: Validate relevant Instagram MUSIC is available without publishing
        working-directory: private-blog
        env:
          INSTAGRAM_AUDIO_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_AUDIO_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import os
          from scripts.social_video.publishers import _trending_instagram_audio
          account = os.environ["INSTAGRAM_BUSINESS_ACCOUNT_ID"]
          import requests
          token = os.environ["INSTAGRAM_AUDIO_ACCESS_TOKEN"]
          for media_id in ("18114075305135475", "18125358295933855"):
              response = requests.get(
                  f"https://graph.facebook.com/v26.0/{media_id}",
                  params={"fields": "media_audio_type", "access_token": token},
                  timeout=20,
              )
              if response.ok:
                  print("Previously published Reel music verification:", media_id,
                        response.json().get("media_audio_type", "UNKNOWN"))
              else:
                  print("Meta media audio-type inspection unavailable:", media_id, response.status_code)
          for category in ("games", "tech"):
              try:
                  audio = _trending_instagram_audio(account, category)
                  assert audio["audio_type"] == "music"
                  print(f"Relevant catalog MUSIC found for {category}; nothing published.")
              except RuntimeError:
                  print(f"Music catalog has no matching tracks for {category}; video publication must remain paused.")
          PY

      - name: Checkout current public repo for transient media-host test
        if: github.event_name == 'push' && (contains(github.event.head_commit.message, '[release-media-smoke]') || contains(github.event.head_commit.message, '[inspect-ig-music]'))
        uses: actions/checkout@v4
        with:
          path: public-site

      - name: Inspect past verified MUSIC choices without publishing
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[inspect-ig-music]')
        working-directory: public-site
        env:
          INSTAGRAM_AUDIO_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_AUDIO_ACCESS_TOKEN }}
        run: python .github/scripts/test_instagram_github_release_media.py --inspect-music

      - name: Install FFmpeg for temporary host test
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release-media-smoke]')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Verify Instagram can fetch a transient GitHub Release MP4 (do not publish)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release-media-smoke]')
        working-directory: public-site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTAGRAM_AUDIO_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_AUDIO_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
        run: python .github/scripts/test_instagram_github_release_media.py

  publish:
    permissions:
      contents: write  # Temporary GitHub Release MP4, deleted after Meta finishes.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'publish' || inputs.mode == 'store-products-preview' || inputs.mode == 'store-products-publish')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[social-publish-now]'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Only the explicit live-cover test publishes one article; regular cadence stays unchanged.
      SOCIAL_MAX_ITEMS_PER_RUN: ${{ contains(github.event.head_commit.message, '[social-publish-now]') && '1' || vars.SOCIAL_MAX_ITEMS_PER_RUN || '2' }}
      # Use only temporary GitHub Release assets; no R2 or direct Instagram upload.
      # Production verification of the GitHub-hosted Instagram MUSIC pipeline.
      SOCIAL_IG_UPLOAD_MODE: github-release
      # Reels use authorized trending catalog audio, not the MP4 narration.
      INSTAGRAM_TREND_AUDIO_VOLUME: "100"
      INSTAGRAM_VIDEO_AUDIO_VOLUME: "0"
      SOCIAL_MAX_VIDEO_MB: ${{ vars.SOCIAL_MAX_VIDEO_MB || '25' }}
      SOCIAL_TTS: kokoro
      SOCIAL_ALLOW_ESPEAK_FALLBACK: "true"
      INSTAGRAM_GRAPH_VERSION: ${{ vars.INSTAGRAM_GRAPH_VERSION || 'v26.0' }}

    steps:
      - name: Checkout private blog repository
        uses: actions/checkout@v4
        with:
          repository: PkLavc/blog
          ref: main
          token: ${{ secrets.PRIVATE_BLOG_REPO_TOKEN }}
          path: private-blog
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight queue image parser dependency
        working-directory: private-blog
        run: python -m pip install 'Pillow>=10,<13'

      - name: Refill article social queues from existing blog posts
        working-directory: private-blog
        env:
          SOCIAL_DAILY_TARGET: ${{ vars.SOCIAL_DAILY_TARGET || '8' }}
        run: python -m scripts.social_video.backfill --daily-target "$SOCIAL_DAILY_TARGET"

      - name: Check pending publications and due Analytics snapshots
        id: pending
        working-directory: private-blog
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_MODE: ${{ inputs.mode }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from scripts.social_video.limits import DAILY_LIMITS, category_of, published_counts
          from scripts.blog_automation.games_topic import is_games_title
          root = Path("social-state")
          def load(name, key):
              path = root / name
              return json.loads(path.read_text(encoding="utf-8")).get(key, []) if path.exists() else []
          today = datetime.now(ZoneInfo("America/Sao_Paulo")).date().isoformat()
          videos = any(
              item.get("status", "pending") == "pending" and
              (category_of(item) != "games" or is_games_title(str(item.get("title") or "") + " " + str(item.get("description") or ""))) and
              published_counts(load(f"{platform}-published.json", "items"), today)[category_of(item)] < DAILY_LIMITS[category_of(item)]
              for platform in ("instagram", "youtube")
              for item in load(f"{platform}-queue.json", "items")
          )
          schedule_run = os.environ.get("EVENT_NAME") == "schedule" and os.environ.get("EVENT_SCHEDULE") == "0 12 * * 2,5"
          dispatch_mode = os.environ.get("DISPATCH_MODE", "")
          has_store = schedule_run or dispatch_mode in {"store-products-preview", "store-products-publish"}
          store_dry_run = dispatch_mode == "store-products-preview"
          publish_queue = ((os.environ.get("EVENT_NAME") == "schedule" and not schedule_run)
                           or dispatch_mode == "publish"
                           or (os.environ.get("EVENT_NAME") == "push" and "[social-publish-now]" in os.environ.get("COMMIT_MESSAGE", "")))
          now = datetime.now(timezone.utc)
          due = False
          for record in load("youtube-analytics.json", "videos"):
              try:
                  published = datetime.fromisoformat(record["publishedAt"].replace("Z", "+00:00"))
              except (KeyError, ValueError):
                  continue
              for snapshot in record.get("snapshots", []):
                  if snapshot.get("status") != "pending":
                      continue
                  try:
                      hours = int(snapshot["scheduledAt"].removesuffix("h"))
                  except (KeyError, ValueError):
                      continue
                  if now >= published + timedelta(hours=hours):
                      due = True
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"has_video={'true' if videos else 'false'}\n")
              output.write(f"has_analytics={'true' if due else 'false'}\n")
              output.write(f"has_store_products={'true' if has_store else 'false'}\n")
              output.write(f"store_products_dry_run={'true' if store_dry_run else 'false'}\n")
              output.write(f"publish_video_queue={'true' if publish_queue else 'false'}\n")
          print(f"Pending social publication: {videos}; due Analytics snapshot: {due}; Store product run: {has_store} (dry-run={store_dry_run}); process article queue: {publish_queue}.")
          PY

      - name: Cache Kokoro model files
        if: (steps.pending.outputs.has_video == 'true' && steps.pending.outputs.publish_video_queue == 'true') || steps.pending.outputs.has_store_products == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: kokoro-82m-${{ runner.os }}-v1

      - name: Install video renderer and publisher dependencies
        if: (steps.pending.outputs.has_video == 'true' && steps.pending.outputs.publish_video_queue == 'true') || steps.pending.outputs.has_store_products == 'true'
        working-directory: private-blog
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install -r scripts/social_video/requirements.txt google-api-python-client google-auth requests

      - name: Publish pending Instagram Reels and YouTube Shorts
        id: social
        if: steps.pending.outputs.has_video == 'true' && steps.pending.outputs.publish_video_queue == 'true'
        continue-on-error: true
        working-directory: private-blog
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_AUDIO_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_AUDIO_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python -m scripts.social_video.publish_queue

      - name: Publish today's 16-product Store video
        id: store_products
        if: steps.pending.outputs.has_store_products == 'true'
        continue-on-error: true
        working-directory: private-blog
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_AUDIO_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_AUDIO_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          if [ "${{ steps.pending.outputs.store_products_dry_run }}" = "true" ]; then
            python -m scripts.social_video.products --dry-run --preview-dir social-preview/store-products
          else
            python -m scripts.social_video.products
          fi

      - name: Upload Store product video preview (not published)
        if: steps.pending.outputs.store_products_dry_run == 'true' && steps.store_products.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pklavc-store-products-preview-${{ github.run_number }}
          path: |
            private-blog/social-preview/store-products/pklavc-store-picks.mp4
            private-blog/social-preview/store-products/manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove stale temporary GitHub Instagram video releases
        if: always()
        continue-on-error: true
        working-directory: private-blog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.social_video.cleanup_github_releases

      - name: Persist queue and publication state
        if: always() && (steps.social.outcome != 'skipped' || steps.store_products.outcome != 'skipped')
        working-directory: private-blog
        run: |
          if [[ -n "$(git status --porcelain -- social-state/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add social-state/
            git commit -m "social: persist publication queue state"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No social state changes to persist."
          fi

      - name: Collect Instagram Reel and Store Insights (never blocks publication)
        id: instagram_analytics
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'publish')
        continue-on-error: true
        working-directory: private-blog
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ANALYTICS_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ANALYTICS_ACCESS_TOKEN }}
          INSTAGRAM_AUDIO_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_AUDIO_ACCESS_TOKEN }}
        run: python -m scripts.social_video.instagram_analytics

      - name: Install Analytics client without video renderer
        if: steps.pending.outputs.has_analytics == 'true' && (steps.pending.outputs.has_video != 'true' || steps.pending.outputs.publish_video_queue != 'true')
        working-directory: private-blog
        run: python -m pip install google-api-python-client google-auth requests

      - name: Collect due YouTube Analytics snapshots
        id: analytics
        if: steps.pending.outputs.has_analytics == 'true'
        continue-on-error: true
        working-directory: private-blog
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_ANALYTICS_REFRESH_TOKEN: ${{ secrets.YOUTUBE_ANALYTICS_REFRESH_TOKEN }}
        run: python -m scripts.social_video.analytics

      - name: Persist Analytics and rolling 18-day editorial feedback
        if: always() && (steps.analytics.outcome != 'skipped' || steps.instagram_analytics.outcome != 'skipped')
        working-directory: private-blog
        run: |
          python -m scripts.social_video.growth_strategy
          if [[ -n "$(git status --porcelain -- social-state/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add social-state/
            git commit -m "social: update measured Analytics and 18-day editorial feedback"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No Analytics state changes to persist."
          fi

      - name: Fail after persisting partial results
        if: always()
        run: |
          if [[ "${{ steps.social.outcome }}" == "failure" || "${{ steps.store_products.outcome }}" == "failure" || "${{ steps.analytics.outcome }}" == "failure" ]]; then
            echo "A social publication or Analytics operation failed; completed state changes were persisted first."
            exit 1
          fi
