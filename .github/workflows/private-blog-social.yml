name: Process private blog social on public runner

on:
  schedule:
    - cron: "47 * * * *"  # One regular Short opportunity per hour
    - cron: "7,37 * * * *"  # Fast breaking-news checks; YouTube only
    - cron: "0 12 * * 5"  # Store Reel on Fridays at 09:00 Sao Paulo
    - cron: "0 12 1 * *"  # Store Short on the first day of each month at 09:00 Sao Paulo
  # workflow_dispatch:
    # inputs:
      # mode:
        # description: "Publish queued items, run checks, or preview/publish Store products"
        # required: true
        # type: choice
        # default: smoke
        # options:
          # - smoke
          # - publish
          # - tiktok-publish
          # - store-products-preview
          # - store-products-publish
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-blog-social.yml"

permissions:
  contents: read

concurrency:
  group: private-blog-public-runner-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event_name == 'push' || inputs.mode == 'smoke'
    permissions:
      contents: write  # Only to create and delete the transient test release.
    runs-on: ubuntu-latest
    timeout-minutes: 90  # Non-publishing extended preview can render a full 75s video
    env:
      PRIVATE_BLOG_REPO_TOKEN: ${{ secrets.PRIVATE_BLOG_REPO_TOKEN }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_AUDIO_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_AUDIO_ACCESS_TOKEN }}
      INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_ANALYTICS_REFRESH_TOKEN: ${{ secrets.YOUTUBE_ANALYTICS_REFRESH_TOKEN }}
    steps:
      - name: Verify required social secrets are configured
        shell: bash
        run: |
          missing=0
          for name in BUFFER_API_KEY PRIVATE_BLOG_REPO_TOKEN INSTAGRAM_ACCESS_TOKEN INSTAGRAM_BUSINESS_ACCOUNT_ID YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN YOUTUBE_ANALYTICS_REFRESH_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Checkout private blog repository
        uses: actions/checkout@v4
        with:
          repository: PkLavc/blog
          ref: main
          token: ${{ secrets.PRIVATE_BLOG_REPO_TOKEN }}
          path: private-blog
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify private repository token can push
        working-directory: private-blog
        run: git push --dry-run origin HEAD:main

      - name: Install smoke-test dependencies
        working-directory: private-blog
        run: |
          python -m pip install -r scripts/blog_automation/requirements.txt
          python -m pip install 'requests>=2.32,<3'

      - name: Verify Buffer API key and @pklavc channel (no post)
        working-directory: private-blog
        run: python -m scripts.social_video.buffer_tiktok

      - name: Validate private social code without publishing
        working-directory: private-blog
        run: bash scripts/private_runner/runner.sh smoke-social && python -m unittest scripts.private_runner.test_tasks
      - name: Render one unpublished long TikTok/YouTube preview
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[render-extended-preview]')
        working-directory: private-blog
        env:
          SOCIAL_TTS: kokoro
          SOCIAL_KOKORO_VOICE: af_bella
          SOCIAL_ALLOW_ESPEAK_FALLBACK: "false"
          SOCIAL_MAX_VIDEO_MB: "25"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install -r scripts/social_video/requirements.txt
          python -m scripts.social_video.preview --slug 2-more-gta-6-screenshots-released --profile extended --out social-preview/extended-qa
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('social-preview/extended-qa/preview-manifest.json').read_text())
          assert manifest['profile'] == 'extended', 'Preview fell back to short; inspect source richness'
          assert 65 <= manifest['durationSeconds'] <= 90, manifest['durationSeconds']
          assert manifest['cardCount'] >= 9, manifest['cardCount']
          media = Path(manifest['videoPath'])
          assert media.is_file()
          assert media.stat().st_size <= 25 * 1024 * 1024
          assert manifest['instagramVideoPath'] == ''
          print(f"Extended non-publishing QA passed: {manifest['durationSeconds']}s, {manifest['cardCount']} scenes, {media.stat().st_size / 1048576:.1f} MiB")
          PY

      - name: Validate relevant Instagram MUSIC is available without publishing
        working-directory: private-blog
        env:
          INSTAGRAM_AUDIO_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_AUDIO_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
        run: python -m scripts.private_runner.tasks social_smoke
      - name: Inspect past verified MUSIC choices without publishing
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[inspect-ig-music]')
        working-directory: private-blog
        env:
          INSTAGRAM_AUDIO_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_AUDIO_ACCESS_TOKEN }}
        run: python -m scripts.private_runner.media_host_check --inspect-music

      - name: Install FFmpeg for temporary host test
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release-media-smoke]')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Verify Instagram can fetch a transient GitHub Release MP4 (do not publish)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release-media-smoke]')
        working-directory: private-blog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTAGRAM_AUDIO_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_AUDIO_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
        run: python -m scripts.private_runner.media_host_check

  publish:
    permissions:
      contents: write  # Temporary media; Buffer videos kept until fetched, then cleaned.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'publish' || inputs.mode == 'tiktok-publish' || inputs.mode == 'store-products-preview' || inputs.mode == 'store-products-publish')) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[social-publish-now]') || contains(github.event.head_commit.message, '[buffer-publish-now]')))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SOCIAL_MAX_ITEMS_PER_RUN: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[tiktok-featured-20261023]')) && '4' || '1' }}  # Normal cadence unchanged
      SOCIAL_URGENT_ONLY: ${{ github.event.schedule == '7,37 * * * *' && 'true' || 'false' }}
      SOCIAL_PLATFORMS: ${{ (inputs.mode == 'tiktok-publish' || contains(github.event.head_commit.message, '[buffer-publish-now]')) && 'tiktok' || ((github.event.schedule == '7,37 * * * *' || contains(github.event.head_commit.message, '[youtube-game-test]')) && 'youtube' || 'instagram,youtube,tiktok') }}
      SOCIAL_FEATURED_SLUGS: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[tiktok-featured-20261023]')) && 'gta-6-create-vice-city-boarding-pass-free,not-even-rockstar-heads-know-everything-that-s-in-gta-6-because,after-18-years-gta-6-might-finally-fix-a-graphical-bug-that-s-pl,report-real-life-gta-6-vehicles-are-driving-around-miami-as-part' || '' }}
      SOCIAL_TARGET_SLUG: ${{ contains(github.event.head_commit.message, '[youtube-game-test]') && 'macca-curated-gta-6-pc-port-could-arrive-within-three-months-of-console-launch' || '' }}
      SOCIAL_IG_UPLOAD_MODE: github-release
      INSTAGRAM_TREND_AUDIO_VOLUME: "100"
      INSTAGRAM_VIDEO_AUDIO_VOLUME: "0"
      # Source-grounded 65-90s TikTok/YouTube exports share one capped MP4;
      # Instagram retains its existing short music-only Reel and cover.
      SOCIAL_MAX_VIDEO_MB: ${{ vars.SOCIAL_MAX_VIDEO_MB || '25' }}
      SOCIAL_TTS: kokoro
      SOCIAL_KOKORO_VOICE: af_bella
      SOCIAL_ALLOW_ESPEAK_FALLBACK: "false"
      INSTAGRAM_GRAPH_VERSION: ${{ vars.INSTAGRAM_GRAPH_VERSION || 'v26.0' }}

    steps:
      - name: Checkout private blog repository
        uses: actions/checkout@v4
        with:
          repository: PkLavc/blog
          ref: main
          token: ${{ secrets.PRIVATE_BLOG_REPO_TOKEN }}
          path: private-blog
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight queue image parser dependency
        working-directory: private-blog
        run: python -m pip install 'Pillow>=10,<13'

      - name: Refill article social queues from existing blog posts
        working-directory: private-blog
        env:
          SOCIAL_DAILY_TARGET: '24'  # YouTube uncapped news queue; Instagram keeps its existing per-category caps
        run: python -m scripts.social_video.backfill --daily-target "$SOCIAL_DAILY_TARGET"

      - name: Curate fresh Macca GTA news for PkLavc YouTube without repeating PkLavc stories
        working-directory: private-blog
        run: python -m scripts.social_video.macca_bridge

      - name: Prepare proven GTA VI TikTok campaign only on explicit release push
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[tiktok-featured-20261023]')
        working-directory: private-blog
        run: |
          python -m compileall -q scripts/social_video
          python -m scripts.social_video.tiktok_featured_campaign

      - name: Check pending publications and due Analytics snapshots
        id: pending
        working-directory: private-blog
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_MODE: ${{ inputs.mode }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: python -m scripts.private_runner.tasks social_gate
      - name: Cache Kokoro model files
        if: (steps.pending.outputs.has_video == 'true' && steps.pending.outputs.publish_video_queue == 'true') || steps.pending.outputs.has_store_products == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: kokoro-82m-${{ runner.os }}-v1

      - name: Install video renderer and publisher dependencies
        if: (steps.pending.outputs.has_video == 'true' && steps.pending.outputs.publish_video_queue == 'true') || steps.pending.outputs.has_store_products == 'true'
        working-directory: private-blog
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install -r scripts/social_video/requirements.txt google-api-python-client google-auth requests

      - name: Publish queued eligible media
        id: social
        if: steps.pending.outputs.has_video == 'true' && steps.pending.outputs.publish_video_queue == 'true'
        continue-on-error: true
        working-directory: private-blog
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_AUDIO_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_AUDIO_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python -m scripts.social_video.publish_queue

      - name: Reconcile previously accepted Buffer TikTok posts
        id: buffer_status
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'publish' || inputs.mode == 'tiktok-publish')
        continue-on-error: true
        working-directory: private-blog
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install -q 'requests>=2.32,<3'
          python -m scripts.social_video.buffer_tiktok --reconcile

      - name: Publish today's 16-product Store video
        id: store_products
        if: steps.pending.outputs.has_store_products == 'true'
        continue-on-error: true
        working-directory: private-blog
        env:
          STORE_PREVIEW: ${{ steps.pending.outputs.store_products_dry_run }}
          STORE_PLATFORMS: ${{ steps.pending.outputs.store_product_platforms }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_AUDIO_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_AUDIO_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: bash scripts/private_runner/runner.sh publish-store
      - name: Upload Store product video preview (not published)
        if: steps.pending.outputs.store_products_dry_run == 'true' && steps.store_products.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pklavc-store-products-preview-${{ github.run_number }}
          path: |
            private-blog/social-preview/store-products/pklavc-store-picks.mp4
            private-blog/social-preview/store-products/manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove stale temporary GitHub Instagram video releases
        if: always()
        continue-on-error: true
        working-directory: private-blog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.social_video.cleanup_github_releases

      - name: Persist queue and publication state
        if: always() && (steps.social.outcome != 'skipped' || steps.store_products.outcome != 'skipped' || steps.buffer_status.outcome == 'success')
        working-directory: private-blog
        run: python -m scripts.private_runner.tasks persist_state
      - name: Collect Instagram Reel and Store Insights (never blocks publication)
        id: instagram_analytics
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'publish')
        continue-on-error: true
        working-directory: private-blog
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ANALYTICS_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ANALYTICS_ACCESS_TOKEN }}
          INSTAGRAM_AUDIO_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_AUDIO_ACCESS_TOKEN }}
        run: python -m scripts.social_video.instagram_analytics

      - name: Collect daily, read-only Buffer insights for TikTok and Instagram
        id: tiktok_analytics
        # Run after all publishing, and never spend the Buffer key on posting to Instagram.
        # The collector's persisted 24-hour guard ensures one API batch per day.
        if: always() && github.event.schedule == '47 * * * *'
        continue-on-error: true
        working-directory: private-blog
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python -m scripts.social_video.buffer_insights_daily

      - name: Install Analytics client without video renderer
        if: steps.pending.outputs.has_analytics == 'true' && (steps.pending.outputs.has_video != 'true' || steps.pending.outputs.publish_video_queue != 'true')
        working-directory: private-blog
        run: python -m pip install google-api-python-client google-auth requests

      - name: Collect due YouTube Analytics snapshots
        id: analytics
        if: steps.pending.outputs.has_analytics == 'true'
        continue-on-error: true
        working-directory: private-blog
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_ANALYTICS_REFRESH_TOKEN: ${{ secrets.YOUTUBE_ANALYTICS_REFRESH_TOKEN }}
        run: python -m scripts.social_video.analytics

      - name: Persist Analytics and rolling 18-day editorial feedback
        if: always() && (steps.analytics.outcome != 'skipped' || steps.instagram_analytics.outcome != 'skipped' || steps.tiktok_analytics.outcome != 'skipped')
        working-directory: private-blog
        run: python -m scripts.private_runner.tasks persist_analytics
      - name: Fail after persisting partial results
        if: always()
        run: |
          if [[ "${{ steps.social.outcome }}" == "failure" || "${{ steps.store_products.outcome }}" == "failure" || "${{ steps.analytics.outcome }}" == "failure" ]]; then
            echo "A social publication or Analytics operation failed; completed state changes were persisted first."
            exit 1
          fi
