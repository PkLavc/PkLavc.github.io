name: Remove legacy navigation once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/remove-legacy-navigation-once.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove legacy navigation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path(".")

          NAV_CONTENT_RE = re.compile(
              r'\s*<(div|nav)\b[^>]*\bid=["\']navigation-content["\'][^>]*>\s*'
              r'(?:<div\b[^>]*class=["\'][^"\']*\blogo\b[^"\']*["\'][^>]*>.*?</div>\s*)?'
              r'<div\b[^>]*class=["\'][^"\']*\bnavigation-links\b[^"\']*["\'][^>]*>.*?</div>\s*'
              r'</\1>',
              re.I | re.S,
          )
          NAV_BAR_RE = re.compile(
              r'\s*<div\b[^>]*\bid=["\']navigation-bar["\'][^>]*>\s*'
              r'<div\b[^>]*class=["\'][^"\']*\bmenubar\b[^"\']*["\'][^>]*>.*?</div>\s*</div>',
              re.I | re.S,
          )

          def remove_js_function(source: str, name: str) -> str:
              needle = f"function {name}"
              pos = source.find(needle)
              while pos != -1:
                  brace = source.find("{", pos)
                  if brace == -1:
                      break
                  depth = 0
                  i = brace
                  quote = None
                  escape = False
                  line_comment = False
                  block_comment = False
                  while i < len(source):
                      ch = source[i]
                      nxt = source[i + 1] if i + 1 < len(source) else ""
                      if line_comment:
                          if ch == "\n":
                              line_comment = False
                          i += 1
                          continue
                      if block_comment:
                          if ch == "*" and nxt == "/":
                              block_comment = False
                              i += 2
                              continue
                          i += 1
                          continue
                      if quote:
                          if escape:
                              escape = False
                          elif ch == "\\":
                              escape = True
                          elif ch == quote:
                              quote = None
                          i += 1
                          continue
                      if ch in ("'", '"', "`"):
                          quote = ch
                          i += 1
                          continue
                      if ch == "/" and nxt == "/":
                          line_comment = True
                          i += 2
                          continue
                      if ch == "/" and nxt == "*":
                          block_comment = True
                          i += 2
                          continue
                      if ch == "{":
                          depth += 1
                      elif ch == "}":
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              while end < len(source) and source[end] in " \t\r\n":
                                  end += 1
                              source = source[:pos] + source[end:]
                              break
                      i += 1
                  else:
                      break
                  pos = source.find(needle)
              return source

          changed = set()

          def write_if_changed(path: Path, original: str, updated: str) -> None:
              if updated != original:
                  path.write_text(updated, encoding="utf-8")
                  changed.add(str(path))

          for path in list(ROOT.rglob("*.html")) + list(ROOT.rglob("*.mjs")):
              if ".git" in path.parts or ".pages-dist" in path.parts:
                  continue
              original = path.read_text(encoding="utf-8")
              text = NAV_CONTENT_RE.sub("\n", original)
              text = NAV_BAR_RE.sub("\n", text)

              if path.suffix == ".html":
                  # About pages have a local fallback implementation of the old menu.
                  text = re.sub(
                      r'\n\s*function setupMenu\(\)\s*\{.*?\n\s*\}\n\s*\n\s*(function setupCursor\(\))',
                      r'\n\n                \1',
                      text,
                      count=1,
                      flags=re.S,
                  )
                  text = remove_js_function(text, "setupMenu")
                  text = re.sub(r'\n\s*setupMenu\(\);', "", text)

                  # Store pages carried a standalone legacy language-menu bridge.
                  def strip_legacy_inline_script(match):
                      body = match.group(0)
                      if "navigation-language-toggle" in body and "navigation-content" in body:
                          return ""
                      return body

                  text = re.sub(r'<script\b[^>]*>.*?</script>', strip_legacy_inline_script, text, flags=re.I | re.S)

                  # Remove isolated references that only served the deleted menu.
                  text = text.replace("a, .menubar, .copy-btn, .contact-value, .credits-trigger", "a, .copy-btn, .contact-value, .credits-trigger")
                  text = text.replace("a,.menubar,.copy-btn,.contact-value,.credits-trigger", "a,.copy-btn,.contact-value,.credits-trigger")
                  text = re.sub(
                      r'^\s*setRoute\(document\.getElementById\(["\'](?:home|about|projects|blog)-link["\']\).*?;\s*\n?',
                      "",
                      text,
                      flags=re.M,
                  )
                  text = re.sub(
                      r'^\s*document\.querySelector\(["\']#navigation-content["\']\)\.setAttribute\(.*?;\s*\n?',
                      "",
                      text,
                      flags=re.M,
                  )
                  text = re.sub(
                      r'^\s*document\.querySelector\(["\']\.menubar["\']\)\.setAttribute\(.*?;\s*\n?',
                      "",
                      text,
                      flags=re.M,
                  )

              write_if_changed(path, original, text)

          global_css = Path("css/global.css")
          original = global_css.read_text(encoding="utf-8")
          text = original
          start = text.find("#navigation-content{")
          end_marker = "#navigation-bar img:hover{ opacity: 1; transform:rotate(-45deg); }"
          end = text.find(end_marker, start)
          if start != -1 and end != -1:
              text = text[:start] + text[end + len(end_marker):]
          write_if_changed(global_css, original, text)

          index_css = Path("css/index.css")
          original = index_css.read_text(encoding="utf-8")
          text = re.sub(
              r'\s*#navigation-content\.is-open\s*~\s*#header\s+\.social-media-links\s*\{[^{}]*\}',
              "",
              original,
              flags=re.S,
          )
          start = text.find("#navigation-bar .menubar {")
          end = text.find("\n.cursor{", start)
          if start != -1 and end != -1:
              text = text[:start] + text[end:]
          write_if_changed(index_css, original, text)

          store_css = Path("store/assets/store.css")
          if store_css.exists():
              original = store_css.read_text(encoding="utf-8")
              text = re.sub(r'#navigation-bar\{[^{}]*\}#navigation-bar \.menubar\{[^{}]*\}', "", original)
              text = text.replace(".store-site-header{position:sticky;padding-right:90px}", "")
              write_if_changed(store_css, original, text)

          index_js = Path("js/index.js")
          original = index_js.read_text(encoding="utf-8")
          text = re.sub(
              r"\n\s*if \(\$\('#navigation-content'\)\.length\) \{\s*"
              r"\$\('#navigation-content'\)\.removeClass\('is-open'\);\s*"
              r"setElementDisplay\('#navigation-content', 'none'\);\s*\}",
              "",
              original,
              count=1,
              flags=re.S,
          )
          start = text.find("var isMenuOpen = false;")
          end = text.find("$(function(){\n  var mobilePointer", start)
          if start != -1 and end != -1:
              text = text[:start] + text[end:]
          text = re.sub(r"\n\s*\$\('\.menubar'\)\.hover\(cursorhover, cursor\);", "", text)
          text = re.sub(r"\n\s*\$\('\.navigation-close'\)\.hover\(cursorhover, cursor\);", "", text)
          text = re.sub(r"\n\s*\$\('\.navigation-language-toggle'\)\.hover\(cursorhover, cursor\);", "", text)
          write_if_changed(index_js, original, text)

          i18n = Path("js/i18n.js")
          original = i18n.read_text(encoding="utf-8")
          text = re.sub(
              r"\n\s*var NAV_LABELS = \{.*?\n\s*\};\n\s*var LANGUAGE_OPTIONS = \[.*?\n\s*\];\n",
              "\n",
              original,
              count=1,
              flags=re.S,
          )
          for name in (
              "createNavigationLabelFragment",
              "renderEnhancedNavigationLabel",
              "getLanguageToggleIconMarkup",
              "setNavigationLink",
              "localizeNavigation",
              "updateLanguageLinks",
              "initLanguageMenu",
              "resetLanguageMenu",
          ):
              text = remove_js_function(text, name)
          text = re.sub(r"\n\s*initLanguageMenu:\s*initLanguageMenu,", "", text)
          text = re.sub(r"\n\s*localizeNavigation:\s*localizeNavigation,", "", text)
          text = re.sub(r"\n\s*resetLanguageMenu:\s*resetLanguageMenu,", "", text)
          export_pos = text.find("window.PkLavcI18n =")
          if export_pos != -1:
              dom_pos = text.find("if (document.readyState === 'loading')", export_pos)
              closure_pos = text.rfind("}());")
              if dom_pos != -1 and closure_pos != -1 and dom_pos < closure_pos:
                  text = text[:dom_pos] + text[closure_pos:]
          write_if_changed(i18n, original, text)

          spot = Path("js/spotlight-navigation.js")
          original = spot.read_text(encoding="utf-8")
          text = remove_js_function(original, "disableLegacyNavigation")
          text = re.sub(r"\n\s*disableLegacyNavigation\(\);", "", text)
          write_if_changed(spot, original, text)

          skylet_chat = Path("ia/skylet-chat.js")
          if skylet_chat.exists():
              original = skylet_chat.read_text(encoding="utf-8")
              text = original
              start = text.find("  const menuButton = document.querySelector('#navigation-bar .menubar');")
              end_marker = "  window.addEventListener('resize', alignClearButtonWithMenu, { passive: true });"
              end = text.find(end_marker, start)
              if start != -1 and end != -1:
                  text = text[:start] + text[end + len(end_marker):]
              write_if_changed(skylet_chat, original, text)

          print(f"Updated {len(changed)} files")
          PY

      - name: Validate cleanup
        shell: bash
        run: |
          node --check js/index.js
          node --check js/i18n.js
          node --check js/spotlight-navigation.js
          node --check ia/skylet-chat.js
          if grep -R -n -E 'id=["'"'"']navigation-(content|bar)["'"'"']|\.menubar|openNavigationMenu|initLanguageMenu|navigation-language-toggle|disableLegacyNavigation'             --include='*.html' --include='*.css' --include='*.js' --include='*.mjs'             --exclude-dir=.git --exclude-dir=.pages-dist .; then
            echo "Legacy navigation references remain."
            exit 1
          fi
          node scripts/build-pages-artifact.mjs
          if grep -R -n -E 'id=["'"'"']navigation-(content|bar)["'"'"']|\.menubar|openNavigationMenu|initLanguageMenu|navigation-language-toggle|disableLegacyNavigation'             --include='*.html' --include='*.css' --include='*.js' .pages-dist; then
            echo "Legacy navigation leaked into the Pages artifact."
            exit 1
          fi

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remove-legacy-navigation-once.yml
          rm -rf .pages-dist
          git add -A
          git commit -m "Remove legacy navigation"
          git push
