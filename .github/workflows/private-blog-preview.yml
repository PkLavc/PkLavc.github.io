name: Render private blog social preview on public runner

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Existing English article slug; blank selects the newest existing post"
        required: false
        default: ""
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-blog-preview.yml"

permissions:
  contents: read

concurrency:
  group: private-blog-public-runner
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout private blog repository
        uses: actions/checkout@v4
        with:
          repository: PkLavc/blog
          ref: main
          token: ${{ secrets.PRIVATE_BLOG_REPO_TOKEN }}
          path: private-blog
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate preview sources
        working-directory: private-blog
        run: python -m compileall -q scripts/social_video

  preview:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Record job start
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout private blog repository
        uses: actions/checkout@v4
        with:
          repository: PkLavc/blog
          ref: main
          token: ${{ secrets.PRIVATE_BLOG_REPO_TOKEN }}
          path: private-blog

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: private-blog/scripts/social_video/requirements.txt

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: kokoro-82m-${{ runner.os }}-v1

      - name: Install renderer dependencies
        working-directory: private-blog
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install -r scripts/social_video/requirements.txt
          python -m pip install -r scripts/blog_automation/requirements.txt

      - name: Select an existing article
        id: article
        working-directory: private-blog
        env:
          REQUESTED_SLUG: ${{ inputs.slug }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          requested = os.environ.get("REQUESTED_SLUG", "").strip()
          posts = json.loads(Path("en/posts.json").read_text(encoding="utf-8"))
          existing = [p for p in posts if (Path("en") / p["url"].rstrip("/").split("/")[-1] / "index.html").is_file()]
          article = next((p for p in existing if p["url"].rstrip("/").split("/")[-1] == requested), None) if requested else (existing[0] if existing else None)
          if not article:
              raise SystemExit("No existing English post matches the requested slug.")
          slug = article["url"].rstrip("/").split("/")[-1]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"slug={slug}\n")
          print(f"Preview article: {slug}")
          PY

      - name: Validate renderer source
        working-directory: private-blog
        run: python -m unittest scripts.social_video.test_render scripts.blog_automation.test_json_safe

      - name: Render and validate preview MP4
        working-directory: private-blog
        env:
          SOCIAL_TTS: kokoro
          SOCIAL_ALLOW_ESPEAK_FALLBACK: "true"
        run: python -m scripts.social_video.preview --repo . --slug "${{ steps.article.outputs.slug }}" --out social-preview

      - name: Write preview summary
        if: always()
        working-directory: private-blog
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          manifest_path = Path("social-preview/preview-manifest.json")
          if manifest_path.exists():
              m = json.loads(manifest_path.read_text())
              lines = ["## Social video preview (not published)", "", f"- Article: \`{m['slug']}\`", f"- Cards: {m['cardCount']}", f"- Duration: {m['durationSeconds']} s", f"- Video: {m['video']['codec']} {m['video']['width']}x{m['video']['height']} @ {m['video']['fps']} FPS", f"- Audio: {m['audio']['codec']}, {m['audio']['sampleRate']} Hz, {m['audio']['channels']} channels", f"- TTS: {m['tts']}; voice: \`{m['voice']}\`; fallback: {m['fallbackUsed']}", f"- Kokoro model load: {m['modelLoadSeconds']} s", f"- Synthesis: {m['synthesisSeconds']} s"]
              summary.write_text("\n".join(lines) + "\n")
          else:
              summary.write_text("## Social video preview failed before producing an MP4.\n")
          PY
          echo "- Total job elapsed: $(( $(date +%s) - JOB_STARTED )) s" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: pklavc-social-video-preview-${{ steps.article.outputs.slug }}
          path: private-blog/social-preview/pklavc-short.mp4
          if-no-files-found: error
          retention-days: 7
