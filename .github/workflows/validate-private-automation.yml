name: Validate private PkLavc and Macca automation

# The private implementation remains in PkLavc/blog. The public runner
# checks it without exposing source code, credentials, outputs, or test traces.
on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-private-automation.yml"

permissions:
  contents: read

concurrency:
  group: validate-private-automation-public
  cancel-in-progress: true

jobs:
  offline-regressions:
    name: Private integration tests on public runner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require private repo access token
        env:
          PRIVATE_BLOG_REPO_TOKEN: ${{ secrets.PRIVATE_BLOG_REPO_TOKEN }}
        run: |
          if [ -z "$PRIVATE_BLOG_REPO_TOKEN" ]; then
            echo "::error::PRIVATE_BLOG_REPO_TOKEN is unavailable."
            exit 1
          fi

      - name: Checkout private automation temporarily
        uses: actions/checkout@v4
        with:
          repository: PkLavc/blog
          ref: main
          token: ${{ secrets.PRIVATE_BLOG_REPO_TOKEN }}
          path: private-blog
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight offline test dependencies
        working-directory: private-blog
        run: python -m pip install -q --disable-pip-version-check 'Pillow>=10,<13' 'requests>=2.32,<3'

      - name: Validate privately and print only sanitized status
        working-directory: private-blog
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m scripts.private_runner.public_ci
