name: Validate TikTok and independent Games changes

on:
  push:
    branches:
      - fix/tiktok-production-review-20261013
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/chatbot/worker/package-lock.json
      - name: Lint and test TikTok Worker
        working-directory: src/chatbot/worker
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test
  blog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: PkLavc/blog
          ref: fix/games-quality-recovery-20261013
          token: ${{ secrets.PRIVATE_BLOG_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate original PkLavc Games implementation
        run: |
          python -m pip install "Pillow>=10,<13"
          python -m compileall -q scripts/blog_automation scripts/social_video
          python -m unittest scripts.blog_automation.test_game_lane scripts.blog_automation.test_publish_paths scripts.social_video.test_limits
