name: Verify PkLavc social video template

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-pklavc-social-video.yml"
  # workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Read private PkLavc blog articles and renderer
        uses: actions/checkout@v4
        with:
          repository: PkLavc/blog
          ref: main
          token: ${{ secrets.PRIVATE_BLOG_REPO_TOKEN }}
          path: blog
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local rendering tools (no paid APIs)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install "Pillow>=10,<13" "requests>=2,<3"
      - name: Test PkLavc branded and unbranded MP4 outputs
        working-directory: blog
        env:
          SOCIAL_TTS: espeak-ng-fallback
        run: python -m unittest scripts.social_video.test_motion scripts.social_video.test_direct_upload scripts.social_video.test_render && python -m scripts.private_runner.tasks video_smoke
      - name: Save one-day MP4 preview for review
        uses: actions/upload-artifact@v4
        with:
          name: pklavc-motion-short-preview
          path: |
            blog/social-preview/pklavc-short.mp4
          retention-days: 1
          if-no-files-found: error
