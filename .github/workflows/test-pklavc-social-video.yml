name: Verify PkLavc social video template

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-pklavc-social-video.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Read private PkLavc blog articles and renderer
        uses: actions/checkout@v4
        with:
          repository: PkLavc/blog
          ref: main
          token: ${{ secrets.PRIVATE_BLOG_REPO_TOKEN }}
          path: blog
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local rendering tools (no paid APIs)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install "Pillow>=10,<13" "requests>=2,<3"
      - name: Test PkLavc branded and unbranded MP4 outputs
        working-directory: blog
        env:
          SOCIAL_TTS: espeak-ng-fallback
        run: |
          python -m unittest scripts.social_video.test_motion scripts.social_video.test_direct_upload scripts.social_video.test_render
          python - <<'PY'
          from pathlib import Path
          from shutil import copy2
          from tempfile import TemporaryDirectory
          from PIL import Image
          from scripts.social_video.render import load_article, render
          slug = "gta-6-album-new-singles-release"
          assert load_article(Path.cwd(), slug)["category"] == "games"
          with TemporaryDirectory() as directory:
              for branded in (True, False):
                  out = Path(directory) / ("branded" if branded else "neutral")
                  result = render(Path.cwd(), slug, out, branded=branded)
                  assert result["cardCount"] <= 4
                  assert result["estimatedVisualCuts"] >= 2
                  assert result["renderMode"] == "multi-shot-editorial-montage-zoom-transitions-subtitles"
                  assert 20 <= result["durationSeconds"] <= 34.1
                  assert result["video"] == {"codec": "h264", "width": 1080, "height": 1920, "fps": "30/1"}
                  assert result["audio"]["codec"] == "aac"
                  assert Path(result["videoPath"]).stat().st_size > 100000
                  with Image.open(out / "card-01.png") as frame:
                      assert frame.size == (1080, 1920)
                  if branded:
                      preview = Path.cwd() / "social-preview"
                      preview.mkdir(exist_ok=True)
                      copy2(result["videoPath"], preview / "pklavc-short.mp4")
                      copy2(out / "preview-manifest.json", preview / "manifest.json")
                  print(("PKLAVC SHORT/REEL" if branded else "NEUTRAL TIKTOK"), result["durationSeconds"], "seconds: PASS")
          PY
      - name: Save one-day MP4 preview for review
        uses: actions/upload-artifact@v4
        with:
          name: pklavc-motion-short-preview
          path: |
            blog/social-preview/pklavc-short.mp4
            blog/social-preview/manifest.json
          retention-days: 1
          if-no-files-found: error
