name: Weekly SEO health audit
on:
  schedule:
    - cron: "43 7 * * 0"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check public sitemap, recent pages and canonical metadata
        run: |
          node --check scripts/check-live-seo.mjs
          node scripts/check-live-seo.mjs --recent --output seo-health-report.json
      - name: Summarize results
        if: always()
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),p='seo-health-report.json';
          if(!fs.existsSync(p)){fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'SEO report unavailable.\n');process.exit(0);}
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,[
            '## PkLavc SEO health','- URLs in sitemap: '+r.sitemapPages,
            '- Recent pages sampled: '+(r.recentSample||[]).length,
            '- HTTP errors/challenges: '+(r.failures||[]).length,
            '- Canonical mismatches: '+(r.canonicalIssues||[]).length,
            '- Missing titles: '+(r.titleIssues||[]).length,
            '- 404 response test: '+r.missingPageStatus,
            'Public HTTP audit; not a Google indexing measurement.'
          ].join('\n')+'\n');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pklavc-seo-health
          path: seo-health-report.json
          if-no-files-found: ignore
          retention-days: 14
