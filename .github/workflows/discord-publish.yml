name: Publish PkLavc news to Discord channels

on:
  workflow_run:
    # The main publishing trigger: the article is live, not a timed polling window.
    workflows: ["Deploy GitHub Pages"]
    types: [completed]
    branches: [main]
  schedule:
    # Recovery only, if an event-driven publication was missed.
    - cron: "39 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Check webhooks, preview, send test messages or publish news"
        required: true
        type: choice
        default: check
        options: [check, preview, test, publish]
      category:
        description: "Category to inspect or publish"
        required: true
        type: choice
        default: all
        options: [all, games, tech]
  push:
    branches: [main]
    paths:
      - ".github/workflows/discord-publish.yml"

permissions:
  contents: read

concurrency:
  group: pklavc-discord-english-tech-games
  cancel-in-progress: false

jobs:
  syndicate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout original Tech and Games articles and Discord state
        uses: actions/checkout@v4
        with:
          repository: PkLavc/blog
          ref: main
          path: private-blog
          token: ${{ secrets.PRIVATE_BLOG_REPO_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
      - name: Checkout authoritative public Store catalog
        uses: actions/checkout@v4
        with:
          repository: PkLavc/PkLavc.github.io
          ref: main
          path: public-site
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline Discord publishing tests
        working-directory: private-blog
        run: python -m unittest scripts.social_video.test_discord_publisher -v
      - name: Preview Tech and Games without posting
        working-directory: private-blog
        run: python -m scripts.social_video.discord_publisher --root . --mode preview --category all
      - name: Verify and publish via official Discord webhooks
        working-directory: private-blog
        shell: bash
        env:
          DISCORD_TECH_WEBHOOK: ${{ secrets.DISCORD_TECH_WEBHOOK }}
          DISCORD_GAMES_WEBHOOK: ${{ secrets.DISCORD_GAMES_WEBHOOK }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_CATEGORY: ${{ inputs.category }}
        run: |
          if [[ -z "$DISCORD_TECH_WEBHOOK" && -z "$DISCORD_GAMES_WEBHOOK" ]]; then
            if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "push" ]]; then
              echo "::notice::Discord not configured; add DISCORD_TECH_WEBHOOK and/or DISCORD_GAMES_WEBHOOK in Actions secrets."
              exit 0
            fi
            echo "::error::Discord webhook secret required for manual live action."
            exit 1
          fi
          python -m scripts.social_video.discord_publisher --root . --mode "${REQUESTED_MODE:-publish}" --category "${REQUESTED_CATEGORY:-all}"

      - name: Publish changed Store products via Discord Store webhook
        working-directory: private-blog
        shell: bash
        env:
          DISCORD_STORE_WEBHOOK: ${{ secrets.DISCORD_STORE_WEBHOOK }}
          TELEGRAM_CHAT_STORE: ${{ vars.TELEGRAM_CHAT_STORE }}
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          if [[ -z "$DISCORD_STORE_WEBHOOK" ]]; then
            echo "::notice::DISCORD_STORE_WEBHOOK is not configured in PkLavc.github.io Actions Secrets."
            exit 0
          fi
          python -m scripts.social_video.store_channels --root . --catalog ../public-site/store/products.json --platform discord --mode "${REQUESTED_MODE:-publish}"


  notify-telegram:
    # Telegram's secret lives in the private blog repo. Signal it only after
    # the public Pages deployment has succeeded so links are available.
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger private Telegram publisher after Pages is live
        shell: bash
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_BLOG_REPO_TOKEN }}
          TELEGRAM_CHAT_STORE: ${{ vars.TELEGRAM_CHAT_STORE }}
        run: |
          if [[ -z "$PRIVATE_REPO_TOKEN" ]]; then
            echo "::error::PRIVATE_BLOG_REPO_TOKEN is required to dispatch Telegram."
            exit 1
          fi
          code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --url 'https://api.github.com/repos/PkLavc/blog/dispatches' \
            --header "Authorization: Bearer $PRIVATE_REPO_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            --data "$(jq -nc --arg store \"$TELEGRAM_CHAT_STORE\" '{event_type:\"pklavc_pages_deployed\",client_payload:{telegram_store_handle:$store}}')")"
          if [[ "$code" != "204" ]]; then
            echo "::error::Private Telegram deployment event was not accepted (HTTP $code)."
            exit 1
          fi
          echo "Private Telegram publication event dispatched after successful Pages deployment."
