<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T-800</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <main class="stage" aria-label="T-800 viewer">
    <div id="viewport" class="viewport">
      <div id="loading" class="loading">Loading model...</div>
      <div id="error" class="error" hidden></div>
    </div>

    <section class="console" aria-label="Speech controls">
      <form id="speech-form" class="speech-form">
        <label class="sr-only" for="speech-input">Text for the T-800 to speak</label>
        <input id="speech-input" name="speech" type="text" maxlength="180" autocomplete="off" placeholder="Digite uma frase..." value="I'll be back.">
        <button type="submit">Enviar</button>
      </form>
    </section>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
