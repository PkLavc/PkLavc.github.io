<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">Prime Video — 30 DAYS FREE</title>
  <desc id="desc">For eligible new subscribers. Terms apply.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06141f"/>
      <stop offset=".48" stop-color="#0a2438"/>
      <stop offset="1" stop-color="#02070d"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="71%" cy="43%" r="67%">
      <stop offset="0" stop-color="#00a8e1" stop-opacity=".42"/>
      <stop offset=".5" stop-color="#0873bb" stop-opacity=".16"/>
      <stop offset="1" stop-color="#00131f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#36e6ff"/>
      <stop offset=".52" stop-color="#00a8e1"/>
      <stop offset="1" stop-color="#0079c6"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#23d7ff"/>
      <stop offset=".52" stop-color="#00a8e1"/>
      <stop offset="1" stop-color="#0b68ff"/>
    </linearGradient>
    <linearGradient id="tv" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#102b40"/>
      <stop offset="1" stop-color="#030a11"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="1600" height="960" fill="url(#bg)"/>
  <rect width="1600" height="960" fill="url(#blueGlow)"/>
  <ellipse cx="1180" cy="420" rx="470" ry="360" fill="#00a8e1" opacity=".10" filter="url(#soft)"/>
  <path d="M650 760 C930 310 1280 130 1600 200" fill="none" stroke="#00a8e1" stroke-opacity=".30" stroke-width="8"/>
  <path d="M690 805 C990 400 1310 220 1600 250" fill="none" stroke="#5adfff" stroke-opacity=".20" stroke-width="3"/>

  <!-- Prime Video wordmark -->
  <g transform="translate(72 62)">
    <text x="0" y="80" font-family="Arial,Helvetica,sans-serif" font-size="84" font-weight="800" letter-spacing="-4">
      <tspan fill="#00a8e1">prime</tspan><tspan fill="#fff"> video</tspan>
    </text>
    <path d="M106 111 C210 164 323 160 404 119" fill="none" stroke="#00a8e1" stroke-width="13" stroke-linecap="round"/>
    <path d="M388 110 l34 9 -20 28" fill="none" stroke="#00a8e1" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Main offer -->
  <g transform="translate(76 250)">
    <text x="0" y="95" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="116" font-weight="900" letter-spacing="-4">30 DAYS</text>
    <text x="0" y="215" fill="url(#cyan)" font-family="Arial,Helvetica,sans-serif" font-size="128" font-weight="900" letter-spacing="-4" filter="url(#glow)">FREE</text>
    <text x="4" y="286" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="700">Prime Video</text>
    <text x="4" y="340" fill="#d8e7ef" font-family="Arial,Helvetica,sans-serif" font-size="29">For eligible new subscribers</text>

    <g transform="translate(0 385)">
      <rect width="560" height="108" rx="54" fill="url(#cta)" filter="url(#glow)"/>
      <circle cx="62" cy="54" r="34" fill="#fff" opacity=".96"/>
      <path d="M52 35 L80 54 L52 73 Z" fill="#00a8e1"/>
      <text x="114" y="68" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="800">START FREE TRIAL</text>
      <path d="M515 43 l17 12 -17 12" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="4" y="548" fill="#9db2bf" font-family="Arial,Helvetica,sans-serif" font-size="22">Terms apply.</text>

    <g transform="translate(0 585)" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#d9e7ee">
      <g><rect x="0" y="0" width="170" height="56" rx="28" fill="#0c2638" stroke="#1f7da8"/><text x="85" y="36" text-anchor="middle">MOVIES</text></g>
      <g transform="translate(186 0)"><rect width="170" height="56" rx="28" fill="#0c2638" stroke="#1f7da8"/><text x="85" y="36" text-anchor="middle">SERIES</text></g>
      <g transform="translate(372 0)"><rect width="190" height="56" rx="28" fill="#0c2638" stroke="#1f7da8"/><text x="95" y="36" text-anchor="middle">ORIGINALS</text></g>
    </g>
  </g>

  <!-- TV / streaming wall -->
  <g transform="translate(790 128)" filter="url(#shadow)">
    <rect x="0" y="0" width="742" height="584" rx="34" fill="#02070d" stroke="#00a8e1" stroke-width="4"/>
    <rect x="18" y="18" width="706" height="548" rx="24" fill="url(#tv)"/>

    <g transform="translate(42 48)">
      <rect x="0" y="0" width="206" height="182" rx="18" fill="#173c55"/>
      <rect x="220" y="0" width="206" height="182" rx="18" fill="#1c273f"/>
      <rect x="440" y="0" width="206" height="182" rx="18" fill="#34202c"/>
      <rect x="0" y="198" width="206" height="182" rx="18" fill="#3b3321"/>
      <rect x="220" y="198" width="206" height="182" rx="18" fill="#16374d"/>
      <rect x="440" y="198" width="206" height="182" rx="18" fill="#232b38"/>

      <g font-family="Arial,Helvetica,sans-serif" font-weight="800" fill="#fff">
        <text x="24" y="108" font-size="34">ACTION</text>
        <text x="244" y="108" font-size="34">SERIES</text>
        <text x="464" y="108" font-size="34">MOVIES</text>
        <text x="24" y="306" font-size="28">ORIGINALS</text>
      </g>

      <g fill="#00a8e1" opacity=".55">
        <circle cx="178" cy="38" r="38"/>
        <circle cx="397" cy="138" r="26"/>
        <circle cx="610" cy="52" r="52"/>
        <rect x="144" y="240" width="34" height="90" rx="17"/>
        <path d="M250 255 l108 0 -54 92z"/>
        <path d="M491 238 q70 -55 138 0 q-68 60 -138 0z"/>
      </g>

      <g transform="translate(252 112)" filter="url(#glow)">
        <circle cx="82" cy="82" r="76" fill="#00a8e1" opacity=".22" stroke="#4fe5ff" stroke-width="4"/>
        <path d="M60 38 L128 82 L60 126 Z" fill="#4de5ff"/>
      </g>
    </g>
  </g>

  <!-- Popcorn bowl -->
  <g transform="translate(1010 690)">
    <path d="M0 92 Q120 160 240 92 L212 205 Q120 244 28 205 Z" fill="#d5e4ec" opacity=".92"/>
    <g fill="#fff7cf" stroke="#e9d699" stroke-width="3">
      <circle cx="38" cy="73" r="29"/><circle cx="72" cy="44" r="31"/><circle cx="106" cy="70" r="34"/><circle cx="142" cy="41" r="30"/><circle cx="176" cy="70" r="34"/><circle cx="211" cy="49" r="27"/>
      <circle cx="58" cy="91" r="34"/><circle cx="102" cy="94" r="33"/><circle cx="151" cy="93" r="35"/><circle cx="197" cy="92" r="31"/>
    </g>
  </g>

  <!-- Remote -->
  <g transform="translate(1260 735) rotate(-11)" filter="url(#shadow)">
    <rect x="0" y="0" width="230" height="92" rx="44" fill="#0b1118" stroke="#334a5b" stroke-width="3"/>
    <circle cx="60" cy="46" r="25" fill="#16212c" stroke="#536a79" stroke-width="3"/>
    <circle cx="60" cy="46" r="8" fill="#00a8e1"/>
    <circle cx="125" cy="35" r="8" fill="#536a79"/>
    <circle cx="151" cy="35" r="8" fill="#536a79"/>
    <circle cx="177" cy="35" r="8" fill="#536a79"/>
    <circle cx="125" cy="60" r="8" fill="#536a79"/>
    <circle cx="151" cy="60" r="8" fill="#536a79"/>
    <circle cx="177" cy="60" r="8" fill="#536a79"/>
  </g>

  <rect x="22" y="22" width="1556" height="916" rx="34" fill="none" stroke="#fff" stroke-opacity=".08"/>
</svg>